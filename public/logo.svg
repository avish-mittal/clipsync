<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="clipGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="160" rx="24" fill="#121214" stroke="#27272A" stroke-width="2"/>

  <!-- Geometric Interlocking Hex-Clip Icon -->
  <g transform="translate(40, 35)">
    <!-- Outer Hex Loop -->
    <path d="M 45 5 L 78 24 L 78 62 L 45 81 L 12 62 L 12 38 L 24 45 L 24 55 L 45 67 L 66 55 L 66 31 L 45 19 L 28 29 L 16 22 Z" fill="url(#clipGreen)"/>
    <!-- Inner Sync Node -->
    <circle cx="45" cy="43" r="6" fill="#10B981" />
  </g>

  <!-- Typography -->
  <text x="145" y="82" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">ClipSync</text>
  
  <!-- Subtitle Badge -->
  <circle cx="150" cy="115" r="4" fill="#10B981" />
  <text x="162" y="119" fill="#71717A" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">100% OPEN SOURCE  |  SELF-HOSTED</text>
</svg>
